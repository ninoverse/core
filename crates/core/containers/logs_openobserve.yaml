services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:latest
    container_name: openobserve
    environment:
      - ZO_ROOT_USER_EMAIL=admin@example.com
      - ZO_ROOT_USER_PASSWORD=ComplexPassword123!
      - ZO_LOCAL_MODE=true
      - ZO_DATA_DIR=/data
    volumes:
      - openobserve-data:/data
    networks:
      - ninoverse-network
