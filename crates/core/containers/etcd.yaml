services:
  etcd:
    image: quay.io/coreos/etcd:v3.7.1
    container_name: etcd
    restart: unless-stopped
    environment:
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_NAME=etcd
    volumes:
      - etcd-data:/etcd-data
    networks:
      - etcd-backend

volumes:
  etcd-data:

networks:
  etcd-backend:
    internal: true