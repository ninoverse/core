domain: "nicolapasqualini.it"
kanidm_origin: "https://auth.nicolapasqualini.it"
secrets_dir: "./secrets"

services:
  - client_id: "victorialogs"
    display_name: "VictoriaLogs"
    subdomain: "victorialogs"
    upstream: "victorialogs:9428"
    group: "victorialogs_users"
    mode: "gate"
  - client_id: "apisix-dashboard"
    display_name: "APISIX Dashboard"
    subdomain: "apidashboard"
    upstream: "apisix:9180"
    group: "apisix_admins"
    mode: "gate"
  - client_id: "sonarqube"
    display_name: "SonarQube"
    subdomain: "sonarqube"
    upstream: "sonarqube:9000"
    group: "sonarqube_users"
    mode: "gate"
  - client_id: "openobserve"
    display_name: "OpenObserve"
    subdomain: "openobserve"
    upstream: "openobserve:5080"
    group: "openobserve_users"
    mode: "gate"
  # nora serves a browser UI and a package-manager API on one host. The UI and
  # every credential/admin endpoint sit behind kanidm; the package paths are
  # passed through untouched so clients can present nora's own tokens.
  # /api/* is gated wholesale: it holds token minting (/api/tokens),
  # revocation, the admin reindex, and the UI's htmx backend — and nora leaves
  # those open when public_web_ui is on, so this route is what protects them.
  - client_id: "registry-ui"
    display_name: "Nora Registry"
    subdomain: "registry"
    upstream: "nora:4000"
    group: "registry_users"
    mode: "gate"
    priority: 100
    uris:
      # nora answers "/" with a relative 303 to "/ui/", so the redirect only
      # works if the gateway routes the bare root here in the first place.
      - "/"
      - "/ui"
      - "/ui/*"
      - "/api/*"
      - "/api-docs"
      - "/api-docs/*"
      - "/metrics"
  # Paths taken from nora's own /api-docs/openapi.json. Formats nora has not
  # enabled still answer here (401/404 from nora rather than from APISIX), so
  # turning one on later needs no gateway change.
  - client_id: "registry-cli"
    display_name: "Nora Registry (CLI)"
    subdomain: "registry"
    upstream: "nora:4000"
    group: "registry_users"
    mode: "proxy"
    priority: 0
    uris:
      - "/cargo/*"
      - "/npm/*"
      - "/maven2/*"
      - "/nuget/*"
      - "/gems/*"
      - "/go/*"
      - "/deb/*"
      - "/rpm/*"
      - "/pub/*"
      - "/ansible/*"
      - "/terraform/*"
      - "/conan/*"
      - "/raw/*"
      - "/simple/*"
      - "/v2/*"
      - "/health"
      - "/ready"
  - client_id: "grafana"
    display_name: "Grafana"
    subdomain: "grafana"
    group: "grafana_users"
    mode: "native"
    native_redirect_url: "https://grafana.nicolapasqualini.it/login/generic_oauth"
  - client_id: "headlamp"
    display_name: "Headlamp"
    subdomain: "headlamp"
    group: "headlamp_admins"
    mode: "native"
    native_redirect_url: "https://headlamp.nicolapasqualini.it/oidc-callback"
  # The broker validates SASL/OAUTHBEARER tokens itself against this client's
  # discovery document, so apisix is not in the Kafka TCP path -- which is what
  # `native` means here. The discovery URL this generates must match
  # oidc_discovery_url in containers/config/redpanda-bootstrap.yaml.
  # native_redirect_url belongs to whichever mobile client runs the flow;
  # replace the placeholder when that app exists.
  - client_id: "kafka"
    display_name: "Redpanda Broker"
    subdomain: "kafka"
    group: "kafka_clients"
    mode: "native"
    native_redirect_url: "https://kafka.nicolapasqualini.it/oidc-callback"
  # Devices that cannot speak the Kafka protocol produce and consume over
  # HTTPS instead. `api` validates a bearer token with no browser flow, and
  # pandaproxy is never published directly -- apisix is its identity boundary.
  - client_id: "kafka-rest"
    display_name: "Redpanda HTTP Proxy"
    subdomain: "kafka"
    upstream: "kafka:8082"
    group: "kafka_clients"
    mode: "api"

persons:
  - name: "nino"
    display_name: "Nino"
    legal_name: "Nicola Pasqualini"
    mail: "nino@nicolapasqualini.it"
    groups:
      - "ninoverse-admin"
      - "apisix_admins"
      - "grafana_users"
      - "victorialogs_users"
      - "sonarqube_users"
      - "openobserve_users"
      - "registry_users"
      - "headlamp_admins"
      - "kafka_clients"
