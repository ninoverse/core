sonar.projectKey=ninoverse-core
sonar.projectName=ninoverse-core
sonar.projectVersion=0.1.0

# Analyze the whole repository, not just src/.
# projectBaseDir is /usr/src (the repo root) inside the scanner container.
sonar.sources=.
sonar.sourceEncoding=UTF-8

# SCM metadata (.git is inside the mount) -> blame, New Code, branch plugin.
sonar.scm.provider=git

# Build output, editor state, generated reports and lockfiles.
# sonarqube/.sonar-token holds a live credential: never ship it to the server.
sonar.exclusions=\
  target/**,\
  .tmp/**,\
  .vscode/**,\
  Cargo.lock,\
  clippy-report.json,\
  lcov.info,\
  sonarqube/.sonar-token

# Reports generated on the host before the scan (see sonarqube/scan.sh).
sonar.rust.clippy.reportPaths=clippy-report.json
sonar.rust.lcov.reportPaths=lcov.info
