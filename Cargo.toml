[workspace]
members = [
    "crates/core",
    "crates/init_kanidm_apisix",
    "crates/logger",
    "crates/kanidm",
    "crates/apisix",
    "crates/exec",
    "crates/http_client",
    "crates/configuration"
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ninoverse/core"
rust-version = "1.85"

[profile.release]
lto = "thin"
codegen-units = 1
